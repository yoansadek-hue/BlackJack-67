<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Blackoff</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
<script type="module" src="js/app.js"></script>
</head>
<body data-theme="emerald" data-back="classic">
<div id="app">

  <!-- Accueil -->
  <section class="screen on" id="s-home">
    <header class="top"><div class="logo">black<b>off</b></div><div class="bal"><i></i><span data-bank>1 000</span></div></header>
    <div id="bonus"></div>
    <button class="mode hero" data-mode="solo">
      <div><small>Solo</small><b>Partie classique</b><span>Toi contre le croupier</span></div><em>→</em>
    </button>
    <div class="modes">
      <button class="mode" data-mode="train"><small>Solo</small><b>Entraînement</b><span>Apprends la stratégie de base</span></button>
      <button class="mode" data-mode="quick"><small>En ligne</small><b>Partie rapide</b><span>Contre un joueur au hasard</span></button>
      <button class="mode wide" data-mode="friends"><small>En ligne</small><b>Avec des amis</b><span>Crée un salon ou rejoins un code · jusqu'à 4 joueurs</span></button>
    </div>
    <p class="net" id="netStatus"><i></i>Connexion…</p>
  </section>

  <!-- Boutique -->
  <section class="screen" id="s-shop">
    <header class="top"><h1>Boutique</h1><div class="bal"><i></i><span data-bank>1 000</span></div></header>
    <div id="shop"></div>
  </section>

  <!-- Amis -->
  <section class="screen" id="s-friends">
    <header class="top"><h1>Amis</h1></header>
    <div class="panel">
      <small class="cap">Ton code ami</small>
      <button class="bigcode" id="copyCode" data-code>——————</button>
      <form class="addf" id="addFriend">
        <input id="friendCode" maxlength="6" placeholder="Code d'un ami" autocomplete="off" autocapitalize="characters">
        <button class="btn primary">Ajouter</button>
      </form>
    </div>
    <div id="friendList"></div>
  </section>

  <!-- Profil -->
  <section class="screen" id="s-profile">
    <header class="top"><h1>Profil</h1><div class="bal"><i></i><span data-bank>1 000</span></div></header>
    <div id="profile"></div>
  </section>

  <!-- Réglages -->
  <section class="screen" id="s-settings">
    <header class="top"><h1>Réglages</h1></header>
    <div id="settings"></div>
  </section>

  <!-- Table -->
  <section class="screen" id="s-table">
    <header class="top">
      <button class="iconbtn" id="leave" aria-label="Quitter"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="tmode" id="tMode">Solo</div>
      <div class="bal"><i></i><span id="tBank">1 000</span></div>
    </header>
    <div id="felt">
      <div class="zone">
        <div class="label">Croupier <span class="score" id="dScore">–</span></div>
        <div class="cards" id="dCards"></div>
      </div>
      <div id="msg"></div>
      <div id="others"></div>
      <div class="zone"><div class="hands" id="pHands"></div></div>
    </div>
    <div id="controls">
      <div id="betUI">
        <div class="betline">
          <div><small>Mise</small><div class="amt" id="betAmt">0</div></div>
          <button class="btn sm" id="clearBet">Effacer</button>
        </div>
        <div class="chips">
          <button class="chip c1" data-v="1">1</button><button class="chip c5" data-v="5">5</button>
          <button class="chip c25" data-v="25">25</button><button class="chip c100" data-v="100">100</button>
          <button class="chip c500" data-v="500">500</button>
        </div>
        <div class="grid">
          <button class="btn" id="rebet">Remiser</button>
          <button class="btn primary" id="deal">Distribuer</button>
        </div>
      </div>
      <div id="playUI" class="grid four">
        <button class="btn" data-a="H">Tirer</button>
        <button class="btn" data-a="S">Rester</button>
        <button class="btn" data-a="D">Doubler</button>
        <button class="btn" data-a="P">Séparer</button>
      </div>
      <div id="waitUI" class="wait"></div>
    </div>
  </section>
</div>

<nav class="tabbar" id="tabbar">
  <span class="tabpill" id="tabPill" aria-hidden="true"><i></i></span>
  <button class="tab" data-go="s-shop"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 7V6a5 5 0 0 1 10 0v1h3l-1.2 13.2A2 2 0 0 1 16.8 22H7.2a2 2 0 0 1-2-1.8L4 7h3zm2 0h6V6a3 3 0 0 0-6 0v1z"/></svg><span>Boutique</span></button>
  <button class="tab" data-go="s-friends"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-3.3 0-7 1.7-7 4.5V20h14v-2.5C16 14.7 12.3 13 9 13zm8-2a3.5 3.5 0 1 0-2.1-6.3 5.9 5.9 0 0 1 0 5.6A3.5 3.5 0 0 0 17 11zm1.2 2.1c1.6 1 2.8 2.5 2.8 4.4V20h3v-2.5c0-2.1-2.6-3.8-5.8-4.4z"/></svg><span>Amis</span><b class="nbadge" id="friendBadge" hidden></b></button>
  <button class="tab" data-go="s-home"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2c3 3.6 8 7 8 11.2A4.3 4.3 0 0 1 15.7 17.5c-1.2 0-2.2-.5-2.9-1.3.3 2 1 3.6 2.2 4.8H9c1.2-1.2 1.9-2.8 2.2-4.8-.7.8-1.7 1.3-2.9 1.3A4.3 4.3 0 0 1 4 13.2C4 9 9 5.6 12 2z"/></svg><span>Jouer</span></button>
  <button class="tab" data-go="s-profile"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.4 0-9 2.2-9 5.5V22h18v-2.5C21 16.2 16.4 14 12 14z"/></svg><span>Profil</span></button>
  <button class="tab" data-go="s-settings"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg><span>Réglages</span></button>
</nav>

<div id="sheet" class="sheet-bg" hidden><div class="sheet" id="sheetBody"></div></div>
<div id="toasts"></div>
</body>
</html>
