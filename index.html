<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Blackoff</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
<script type="module" src="js/app.js"></script>
</head>
<body data-back="stripes" class="locked">

<!-- Connexion obligatoire -->
<div id="gate">
  <div class="gate-in">
    <img src="icons/icon.svg" alt="" class="gate-icon">
    <div class="wordmark">blackoff</div>
    <p>Le blackjack, sans le superflu.</p>
  </div>
  <div class="gate-act">
    <button class="btn white full gbtn" id="login" disabled><svg class="glogo" viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Continuer avec Google</button>
    <small id="gateMsg">Chargement…</small>
  </div>
</div>

<div id="app">
  <!-- Accueil -->
  <section class="screen on" id="s-home">
    <header class="top"><div class="wordmark sm">blackoff</div><button class="me" data-go-profile aria-label="Profil"><span class="av" data-av></span></button></header>
    <div class="hero"><div class="bigbank" data-bank>1 000</div><small id="lvlLine"></small></div>
    <div class="carousel" id="modes"></div>
    <div class="cdots" id="modeDots"></div>
    <h2 class="h">Table</h2>
    <div class="spills" id="stakes"></div>
    <h2 class="h">Classement de la semaine</h2>
    <div class="board" id="board"><div class="empty dots">Chargement</div></div>
    <p class="net" id="netStatus"><i></i>Connexion…</p>
  </section>

  <section class="screen" id="s-shop">
    <header class="top"><h1>Boutique</h1><span class="bank"><i class="coin"></i><span data-bank>1 000</span></span></header>
    <div id="shop"></div>
  </section>

  <section class="screen" id="s-friends">
    <header class="top"><h1>Amis</h1></header>
    <div class="panel">
      <small class="cap">Ton code ami</small>
      <button class="bigcode" id="copyCode" data-code>——————</button>
      <form class="addf" id="addFriend">
        <input id="friendCode" maxlength="6" placeholder="Code d'un ami" autocomplete="off" autocapitalize="characters">
        <button class="btn white">Ajouter</button>
      </form>
    </div>
    <div id="friendList"></div>
  </section>

  <section class="screen" id="s-profile">
    <header class="top"><h1>Profil</h1></header>
    <div id="profile"></div>
  </section>

  <section class="screen" id="s-settings">
    <header class="top"><h1>Réglages</h1></header>
    <div id="settings"></div>
  </section>

  <!-- Table -->
  <section class="screen" id="s-table">
    <header class="ttop">
      <button class="backbtn" id="leave" aria-label="Quitter"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="players" id="others"></div>
      <div class="tinfo" id="tMode"></div>
      <button class="react-btn" id="reactBtn" hidden aria-label="Réactions"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg></button>
    </header>
    <div class="dealer">
      <div class="cards" id="dCards"></div>
      <div class="dtotal" id="dScore"></div>
    </div>
    <div id="msg"></div>
    <div id="reactBar" hidden></div>
    <div class="mid"><div class="hands" id="pHands"></div></div>
    <div id="odds"></div>
    <div id="dock">
      <div id="betUI">
        <div class="chips" id="chips"></div>
        <div class="row2"><button class="pill icon" id="clearBet" aria-label="Effacer la mise"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button><button class="pill" id="rebet">Remiser</button><button class="pill white" id="deal">Miser</button></div>
      </div>
      <div id="playUI">
        <button class="pill" data-a="P">Séparer</button>
        <button class="pill" data-a="D">Doubler</button>
        <button class="pill" data-a="H">Tirer</button>
        <button class="pill white" data-a="S">Rester</button>
      </div>
      <div id="waitUI" class="wait"></div>
      <div class="mebox"><span class="bubble" id="meBubble" hidden></span><span class="av" data-av></span><small id="meHand">Mise</small><b id="tBank">0</b></div>
    </div>
  </section>
</div>

<nav class="tabbar" id="tabbar">
  <span class="tabpill" id="tabPill" aria-hidden="true"><i></i></span>
  <button class="tab" data-go="s-shop"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 7V6a5 5 0 0 1 10 0v1h3l-1.2 13.2A2 2 0 0 1 16.8 22H7.2a2 2 0 0 1-2-1.8L4 7h3zm2 0h6V6a3 3 0 0 0-6 0v1z"/></svg><span>Boutique</span></button>
  <button class="tab" data-go="s-friends"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-3.3 0-7 1.7-7 4.5V20h14v-2.5C16 14.7 12.3 13 9 13zm8-2a3.5 3.5 0 1 0-2.1-6.3 5.9 5.9 0 0 1 0 5.6A3.5 3.5 0 0 0 17 11zm1.2 2.1c1.6 1 2.8 2.5 2.8 4.4V20h3v-2.5c0-2.1-2.6-3.8-5.8-4.4z"/></svg><span>Amis</span></button>
  <button class="tab" data-go="s-home"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2c3 3.6 8 7 8 11.2A4.3 4.3 0 0 1 15.7 17.5c-1.2 0-2.2-.5-2.9-1.3.3 2 1 3.6 2.2 4.8H9c1.2-1.2 1.9-2.8 2.2-4.8-.7.8-1.7 1.3-2.9 1.3A4.3 4.3 0 0 1 4 13.2C4 9 9 5.6 12 2z"/></svg><span>Jouer</span></button>
  <button class="tab" data-go="s-profile"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.4 0-9 2.2-9 5.5V22h18v-2.5C21 16.2 16.4 14 12 14z"/></svg><span>Profil</span></button>
  <button class="tab" data-go="s-settings"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg><span>Réglages</span></button>
</nav>

<div id="sheet" class="sheet-bg" hidden><div class="sheet" id="sheetBody"></div></div>
<div id="toasts"></div>
</body>
</html>
